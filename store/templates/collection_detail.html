{% extends 'base.html' %}
{% block title %}Accueil{% endblock %}

{% block content %}
<h2 class="mb-4">Nos produits</h2>

<div class="row">
  {% for product in products %}
  <div class="col-md-4 mb-4">
    <div class="card h-100">
      <img src="{{ product.image_url }}" class="card-img-top" style="height: 250px; object-fit: cover;">
      <div class="card-body">
        <h5 class="card-title">{{ product.name }}</h5>
        <p>Prix : {{ product.price }} DH</p>
        <p>Taille : {{ product.size }} - Couleur : {{ product.color }}</p>
        <a href="{% url 'add_to_cart' product.id %}" class="btn btn-dark w-100">Ajouter au panier</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
