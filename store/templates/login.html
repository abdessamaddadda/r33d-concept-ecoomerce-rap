{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    .logo-navbar {
      height: 30px;
      object-fit: contain;
    }

    .form-container {
      max-width: 400px;
      margin: 80px auto;
      background-color: #1c1c1c;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.05);
    }

    .btn-yellow {
      background-color: transparent;
      color: white;
      border: 1px solid #ffc107;
      transition: background 0.3s, color 0.3s;
    }

    .btn-yellow:hover {
      background-color: #ffc107;
      color: black;
    }
  </style>
</head>

<body>

<!-- Bandeau -->
<div class="bg-black text-white text-center py-1 animated-banner">
  🚚 FREE SHIPPING ON 3+ PRODUCTS 🚚
</div>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-black py-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <div class="text-white">D.K.E.K CONCEPT</div>
    <div>
      <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo-navbar">
    </div>
    <div></div>
  </div>
      <div>
      {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2">
          <span class="text-white">👤 {{ user.username }}</span>
          <a href="{% url 'logout' %}" class="btn btn-outline-warning btn-sm">Déconnexion</a>
        </div>
      {% else %}
        <div class="d-flex align-items-center gap-2">
          <a href="{% url 'login' %}" class="btn btn-outline-warning btn-sm">Connexion</a>
          <a href="{% url 'signup' %}" class="btn btn-outline-warning btn-sm">Créer un compte</a>
        </div>
      {% endif %}
    </div>
</nav>

<!-- Formulaire login -->
<div class="form-container">
  <h2 class="text-center mb-4">Connexion</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-yellow w-100">Se connecter</button>
  </form>
  <p class="mt-3 text-center">
    Pas encore de compte ? <a href="{% url 'signup' %}" class="text-warning">Créer un compte</a>
  </p>
</div>

</body>
</html>
